<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f2">
  <title>My Cart | MyShopzy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #20291f;
      --muted: #7b8377;
      --line: #e9ece4;
      --paper: #ffffff;
      --canvas: #f7f8f2;
      --green: #267347;
      --green-dark: #1d5d39;
      --green-soft: #edf5eb;
      --orange: #dd7948;
      font-family: "DM Sans", sans-serif;
      background: var(--canvas);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; }
    button, input { font: inherit; }
    button { color: inherit; }

    .page-shell {
      width: min(100% - 40px, 1032px);
      margin: 0 auto;
      padding: 30px 0 54px;
    }

    .topbar { display: flex; align-items: center; gap: 17px; }
    .back-link {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease;
    }
    .back-link:hover { transform: translateX(-2px); border-color: #cbd7c8; }
    .back-link svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .heading-copy h1 { margin: 0; font: 800 25px/1.2 "Manrope", sans-serif; letter-spacing: 0; }
    .heading-copy p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .step-label { margin-left: auto; color: #99a092; font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
    .step-label span { color: var(--green); }

    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(290px, 0.85fr); gap: 28px; margin-top: 34px; align-items: start; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 0 13px; }
    .section-heading h2 { margin: 0; font: 700 15px/1.3 "Manrope", sans-serif; letter-spacing: 0; }
    .section-heading span { color: var(--muted); font-size: 12px; }

    .items-panel, .summary-panel { border: 1px solid #eaede5; border-radius: 9px; background: var(--paper); }
    .items-panel { max-height: min(46vh, 420px); overflow-y: auto; overscroll-behavior-y: contain; padding: 0 20px; scrollbar-color: #cbd7c8 transparent; scrollbar-width: thin; }
    .cart-item { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; align-items: center; gap: 16px; min-height: 116px; padding: 15px 0; }
    .cart-item + .cart-item { border-top: 1px solid var(--line); }
    .product-image { display: block; width: 84px; height: 84px; border-radius: 8px; object-fit: cover; background: #f1f3ed; }
    .product-name { margin: 0; font: 700 14px/1.35 "Manrope", sans-serif; letter-spacing: 0; }
    .product-meta { margin: 5px 0 9px; color: var(--muted); font-size: 12px; }
    .product-price { color: var(--green-dark); font-size: 14px; font-weight: 800; }
    .quantity-control { display: flex; align-items: center; gap: 12px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .quantity-control button { display: grid; width: 26px; height: 26px; place-items: center; border: 0; border-radius: 6px; background: var(--green-soft); color: var(--green-dark); cursor: pointer; font-size: 17px; line-height: 1; transition: background 150ms ease; }
    .quantity-control button:hover { background: #dcebd9; }
    .quantity-control output { min-width: 12px; text-align: center; font-size: 13px; font-weight: 700; }

    .promo-panel { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 17px 19px; border: 1px solid #eaede5; border-radius: 9px; background: var(--paper); }
    .promo-icon { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 8px; background: #fff3e9; color: var(--orange); }
    .promo-icon svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .promo-entry { min-width: 0; flex: 1; }
    .promo-entry input { width: 100%; padding: 4px 0; border: 0; outline: 0; color: var(--ink); font-size: 13px; }
    .promo-entry input::placeholder { color: #8b9287; opacity: 1; }
    .promo-entry input:focus-visible { outline: 2px solid #c6dfc8; outline-offset: 3px; border-radius: 2px; }
    .apply-button { padding: 8px 4px 8px 10px; border: 0; background: transparent; color: var(--green); cursor: pointer; font-size: 12px; font-weight: 800; }
    .apply-button:hover { color: var(--green-dark); }
    .promo-message { min-height: 0; margin: 0; color: var(--green); font-size: 11px; }

    .summary-panel { padding: 21px 20px 19px; }
    .summary-panel h2 { margin: 0 0 19px; font: 700 15px/1.3 "Manrope", sans-serif; letter-spacing: 0; }
    .summary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0; color: #737b71; font-size: 13px; }
    .summary-row strong { color: var(--ink); font-size: 13px; font-weight: 700; }
    .summary-divider { height: 1px; margin: 19px 0 17px; border: 0; background: var(--line); }
    .summary-total { margin: 0; color: var(--ink); font-size: 14px; font-weight: 800; }
    .summary-total strong { font: 800 21px/1 "Manrope", sans-serif; letter-spacing: 0; }
    .delivery-note { display: flex; align-items: center; gap: 7px; margin: 16px 0 0; padding: 10px; border-radius: 7px; background: var(--green-soft); color: var(--green-dark); font-size: 11px; font-weight: 600; }
    .delivery-note svg { width: 15px; height: 15px; flex: 0 0 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .checkout-button { display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; border: 0; border-radius: 9px; background: var(--green); color: white; cursor: pointer; font-size: 13px; font-weight: 800; transition: background 160ms ease, transform 160ms ease; }
    .checkout-button:hover { transform: translateY(-1px); background: var(--green-dark); }
    .checkout-button:focus-visible, .quantity-control button:focus-visible, .apply-button:focus-visible, .back-link:focus-visible { outline: 3px solid #a9d0ae; outline-offset: 3px; }
    .checkout-button span { font-size: 17px; line-height: 1; }
    .checkout-message { min-height: 14px; margin: 10px 0 0; color: var(--muted); text-align: center; font-size: 11px; }

    @media (max-width: 700px) {
      .page-shell { width: min(100% - 32px, 480px); padding: 19px 0 28px; }
      .topbar { gap: 12px; }
      .back-link { width: 40px; height: 40px; flex-basis: 40px; border-radius: 13px; }
      .heading-copy h1 { font-size: 22px; }
      .step-label { display: none; }
      .layout { grid-template-columns: 1fr; gap: 21px; margin-top: 25px; }
      .cart-item { grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; min-height: 101px; padding: 13px 0; }
      .product-image { width: 70px; height: 70px; }
      .product-name { font-size: 13px; }
      .product-meta { margin: 4px 0 7px; font-size: 11px; }
      .product-price { font-size: 13px; }
      .quantity-control { gap: 7px; padding: 4px; }
      .quantity-control button { width: 25px; height: 25px; }
      .items-panel { max-height: 36svh; padding: 0 13px; }
      .summary-panel { padding: 19px 17px 16px; }
      .promo-panel { padding: 14px; }
    }

    @media (max-width: 370px) {
      .page-shell { width: calc(100% - 24px); }
      .cart-item { grid-template-columns: 58px minmax(0, 1fr) auto; gap: 9px; }
      .product-image { width: 58px; height: 58px; }
      .quantity-control { gap: 4px; }
      .quantity-control button { width: 23px; height: 23px; }
      .quantity-control output { min-width: 10px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="back-link" href="frontend/index.html" aria-label="Back to shopping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" /></svg>
      </a>
      <div class="heading-copy">
        <h1>My Cart</h1>
        <p id="item-count">3 items</p>
      </div>
      <div class="step-label"><span>01</span> / 03 &nbsp; Your basket</div>
    </header>

    <div class="layout">
      <section aria-labelledby="items-title">
        <div class="section-heading">
          <h2 id="items-title">Your items</h2>
          <span>Fresh picks, just for you</span>
        </div>
        <div class="items-panel" id="cart-items">
          <article class="cart-item" data-price="50">
            <img class="product-image" src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=240&q=85" alt="Fresh yellow bananas" width="84" height="84">
            <div>
              <h3 class="product-name">Banana</h3>
              <p class="product-meta">1 kg</p>
              <div class="product-price">₹50</div>
            </div>
            <div class="quantity-control" aria-label="Banana quantity">
              <button type="button" data-change="-1" aria-label="Remove one Banana">&minus;</button>
              <output aria-live="polite">1</output>
              <button type="button" data-change="1" aria-label="Add one Banana">+</button>
            </div>
          </article>
          <article class="cart-item" data-price="70">
            <img class="product-image" src="https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=240&q=85" alt="Glass bottle of fresh milk" width="84" height="84">
            <div>
              <h3 class="product-name">Milk Full Cream</h3>
              <p class="product-meta">1 litre</p>
              <div class="product-price">₹70</div>
            </div>
            <div class="quantity-control" aria-label="Milk Full Cream quantity">
              <button type="button" data-change="-1" aria-label="Remove one Milk Full Cream">&minus;</button>
              <output aria-live="polite">1</output>
              <button type="button" data-change="1" aria-label="Add one Milk Full Cream">+</button>
            </div>
          </article>
          <article class="cart-item" data-price="45">
            <img class="product-image" src="https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=240&q=85" alt="Fresh whole wheat bread loaf" width="84" height="84">
            <div>
              <h3 class="product-name">Whole Wheat Bread</h3>
              <p class="product-meta">400 g</p>
              <div class="product-price">₹45</div>
            </div>
            <div class="quantity-control" aria-label="Whole Wheat Bread quantity">
              <button type="button" data-change="-1" aria-label="Remove one Whole Wheat Bread">&minus;</button>
              <output aria-live="polite">1</output>
              <button type="button" data-change="1" aria-label="Add one Whole Wheat Bread">+</button>
            </div>
          </article>
        </div>

        <form class="promo-panel" id="promo-form">
          <div class="promo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m20.6 13.4-7.2 7.2a2 2 0 0 1-2.8 0l-7.2-7.2a2 2 0 0 1 0-2.8l7.2-7.2A2 2 0 0 1 12 2.8h7a2 2 0 0 1 2 2v7a2 2 0 0 1-.4 1.6Z"/><circle cx="16.5" cy="7.5" r="1"/></svg>
          </div>
          <div class="promo-entry">
            <input id="promo-code" type="text" placeholder="Have a promo code?" aria-label="Promo code">
            <p class="promo-message" id="promo-message" aria-live="polite"></p>
          </div>
          <button class="apply-button" type="submit">Apply</button>
        </form>
      </section>

      <aside aria-labelledby="summary-title">
        <div class="section-heading"><h2 id="summary-title">Order summary</h2></div>
        <div class="summary-panel">
          <div class="summary-row"><span>Subtotal</span><strong id="subtotal">₹165</strong></div>
          <div class="summary-row"><span>Delivery Fee</span><strong>₹30</strong></div>
          <hr class="summary-divider">
          <div class="summary-row summary-total"><span>Total</span><strong id="total">₹195</strong></div>
          <p class="delivery-note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="17.5" cy="18" r="1.5"/></svg>
            Fast delivery, straight to your door
          </p>
          <button class="checkout-button" id="checkout-button" type="button">Proceed to Checkout <span aria-hidden="true">&rarr;</span></button>
          <p class="checkout-message" id="checkout-message" aria-live="polite"></p>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const cartItems = document.querySelectorAll(".cart-item");
    const deliveryFee = 30;

    function formatINR(amount) {
      return new Intl.NumberFormat("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 0
      }).format(amount);
    }

    function updateSummary() {
      let subtotal = 0;
      let itemCount = 0;

      cartItems.forEach((item) => {
        const quantity = Number(item.querySelector("output").value || item.querySelector("output").textContent);
        subtotal += Number(item.dataset.price) * quantity;
        itemCount += quantity;
      });

      document.querySelector("#item-count").textContent = `${itemCount} ${itemCount === 1 ? "item" : "items"}`;
      document.querySelector("#subtotal").textContent = formatINR(subtotal);
      document.querySelector("#total").textContent = formatINR(subtotal + deliveryFee);
    }

    document.querySelector("#cart-items").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-change]");
      if (!button) return;

      const output = button.parentElement.querySelector("output");
      const quantity = Math.max(0, Number(output.textContent) + Number(button.dataset.change));
      output.textContent = quantity;
      button.parentElement.querySelector('button[data-change="-1"]').disabled = quantity === 0;
      updateSummary();
    });

    document.querySelector("#promo-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const code = document.querySelector("#promo-code").value.trim();
      document.querySelector("#promo-message").textContent = code ? "That promo code isn't available." : "Enter a promo code to apply.";
    });

    document.querySelector("#checkout-button").addEventListener("click", () => {
      document.querySelector("#checkout-message").textContent = "Checkout is ready when you are.";
    });

    updateSummary();
  </script>
</body>
</html>
