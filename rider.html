<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShopzy Rider Hub | Ravulapalem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css">

  <!-- FIREBASE SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0B132B',
              navyLight: '#1C2541',
              accent: '#3A86FF',
              slateBg: '#F8FAFC',
              border: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans antialiased min-h-screen pb-12">

  <!-- TOP APP BAR -->
  <header class="bg-brand-navy text-white px-4 py-3.5 sticky top-0 z-30 shadow-md border-b border-slate-800">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-cyan-400 text-brand-navy flex items-center justify-center font-black text-lg">
          🛵
        </div>
        <div>
          <h1 class="text-xs font-black uppercase tracking-wider text-cyan-300">MyShopzy Express</h1>
          <p class="text-[11px] text-slate-300">Ravulapalem Delivery Console</p>
        </div>
      </div>

      <!-- Active Rider Switcher -->
      <select id="riderSelect" onchange="switchRider(this.value)" class="text-xs font-bold bg-brand-navyLight border border-slate-700 text-white rounded-xl px-2.5 py-1.5 outline-none">
        <option value="Suresh">Rider: Suresh</option>
        <option value="Ramesh">Rider: Ramesh</option>
      </select>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- RIDER STATUS CARD -->
    <div class="bg-white rounded-2xl p-4 border border-brand-border shadow-sm flex items-center justify-between">
      <div>
        <span class="text-[10px] uppercase font-bold text-slate-400">Assigned Delivery Partner</span>
        <h2 id="currentRiderTitle" class="text-base font-extrabold text-slate-900 mt-0.5">Suresh</h2>
        <p class="text-[11px] text-emerald-600 font-bold flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> On-Duty (Express Hub)
        </p>
      </div>
      <div class="text-right">
        <span class="text-[10px] uppercase font-bold text-slate-400">Pending Orders</span>
        <h3 id="pendingCount" class="text-2xl font-black text-brand-accent">0</h3>
      </div>
    </div>

    <!-- TABS: PENDING vs DELIVERED -->
    <div class="flex gap-2 bg-slate-200/70 p-1 rounded-xl">
      <button id="tabPendingBtn" onclick="toggleRiderTab('pending')" class="flex-1 py-2 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition">
        Active Orders
      </button>
      <button id="tabCompletedBtn" onclick="toggleRiderTab('completed')" class="flex-1 py-2 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition">
        Delivered Today
      </button>
    </div>

    <!-- ORDERS FEED -->
    <div id="riderOrdersContainer" class="space-y-3">
      <p class="text-center text-slate-400 py-12 text-xs">Connecting to dispatch stream...</p>
    </div>

  </main>

  <!-- OTP VERIFICATION MODAL -->
  <div id="otpModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-brand-border space-y-4">
      <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-xl font-bold">
        🔑
      </div>
      <div>
        <h3 class="text-base font-extrabold text-slate-900">Verify Delivery OTP</h3>
        <p class="text-xs text-slate-500 mt-1">Ask customer for the 4-digit code shown on their tracking screen.</p>
      </div>

      <input 
        id="inputDeliveryOtp" 
        type="tel" 
        maxlength="4" 
        placeholder="••••" 
        class="w-full text-center tracking-[1em] text-2xl font-black py-3 border-2 border-slate-200 rounded-2xl focus:border-brand-accent outline-none bg-slate-50"
      >

      <p id="otpErrorMessage" class="hidden text-xs font-bold text-rose-500">Invalid OTP. Please check with customer!</p>

      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="closeOtpModal()" class="py-2.5 rounded-xl border border-slate-200 font-bold text-xs text-slate-600">
          Cancel
        </button>
        <button onclick="confirmOtpAndDeliver()" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs">
          Confirm Delivery
        </button>
      </div>
    </div>
  </div>

  <!-- MODULAR JAVASCRIPT CALLS -->
  <script src="js/firebase-config.js"></script>
  <script src="js/rider.js"></script>
</body>
</html>
